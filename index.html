<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stability Checker: Roommates with Roles</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eaeff2; color: #333; max-width: 900px; margin: 30px auto; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; color: #2c3e50; }
        
        .section { margin-bottom: 25px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; color: #34495e; }
        .desc { font-size: 0.85em; color: #7f8c8d; margin-bottom: 8px; }
        
        textarea, input[type="text"], input[type="number"] { width: 100%; padding: 12px; border: 1px solid #dcdcdc; border-radius: 6px; font-family: 'Courier New', monospace; box-sizing: border-box; font-size: 14px; }
        textarea { height: 100px; resize: vertical; }
        
        button { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 6px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2980b9; }

        #result-area { display: none; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .status-box { padding: 15px; border-radius: 6px; font-weight: bold; text-align: center; margin-bottom: 20px; font-size: 1.2em; }
        .stable { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .unstable { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .blocking-pair { background: #fff3cd; border-left: 5px solid #ffc107; padding: 10px 15px; margin-bottom: 10px; font-family: monospace; }
        .blocking-pair strong { color: #856404; }
    </style>
</head>
<body>

<div class="card">
    <h1>Stability Checker</h1>

    <div class="section">
        <label>1. Partner Preferences</label>
        <div class="desc">Row 1 = Agent 1's ranking, Row 2 = Agent 2's ranking... (Space separated)</div>
        <textarea id="prefs">2 3 4
3 1 4
1 2 4
1 2 3</textarea>
    </div>

    <div class="section">
        <label>2. Role Preferences</label>
        <div class="desc">Enter preferred role (L or F) for each agent sequentially. e.g., "L L F L"</div>
        <input type="text" id="rolePrefs" value="L L L L">
    </div>

    <div class="section">
        <label>3. Proposed Matching & Role Assignment</label>
        <div class="desc">Format per line: <code>AgentID Role AgentID Role</code></div>
        <div class="desc">Example: <code>1 L 2 F</code> (Means 1 is Leader matched to 2 who is Follower)</div>
        <textarea id="matchingInput" style="height: 150px;">1 L 4 F
3 L 2 F</textarea>
    </div>

    <button onclick="checkStability()">Check Stability</button>

    <div id="result-area">
        <div id="statusBox" class="status-box"></div>
        <div id="details"></div>
    </div>
</div>

<script>
    function checkStability() {
        // --- 1. PARSE INPUTS ---
        const prefText = document.getElementById('prefs').value.trim();
        const roleText = document.getElementById('rolePrefs').value.trim();
        const matchText = document.getElementById('matchingInput').value.trim();

        // Parse Preferences
        const prefs = {};
        const lines = prefText.split('\n');
        const N = lines.length;
        lines.forEach((line, idx) => {
            prefs[idx + 1] = line.trim().split(/\s+/).map(Number);
        });

        // Parse Role Preferences
        const desiredRoles = {};
        const roleParts = roleText.split(/[\s,]+/);
        for(let i=0; i<N; i++) {
            desiredRoles[i+1] = (roleParts[i] || 'L').toUpperCase();
        }

        // Parse Matching
        const currentMatch = {}; // { 1: {partner: 2, role: 'L'}, 2: {partner: 1, role: 'F'} }
        
        // Initialize all as unmatched first
        for(let i=1; i<=N; i++) currentMatch[i] = { partner: null, role: null };

        const matchLines = matchText.split('\n');
        matchLines.forEach(line => {
            if(!line.trim()) return;
            // Expected: "1 L 2 F"
            const parts = line.trim().split(/\s+/);
            if(parts.length === 4) {
                const p1 = parseInt(parts[0]);
                const r1 = parts[1].toUpperCase();
                const p2 = parseInt(parts[2]);
                const r2 = parts[3].toUpperCase();

                currentMatch[p1] = { partner: p2, role: r1 };
                currentMatch[p2] = { partner: p1, role: r2 };
            }
        });

        // --- 2. STABILITY LOGIC ---
        const blockingPairs = [];
        const seenPairs = new Set();

        // Helper: Is (newRole, newPartner) better than current for agent?
        function isBetter(agent, newRole, newPartner) {
            const curr = currentMatch[agent];
            const wanted = desiredRoles[agent];

            const currHasWanted = (curr.role === wanted);
            const newHasWanted = (newRole === wanted);

            // 1. Role Dominance Check
            if (newHasWanted && !currHasWanted) return true; // Gained Preferred Role
            if (!newHasWanted && currHasWanted) return false; // Lost Preferred Role

            // 2. Partner Rank Check (if Role satisfaction is equal)
            const pList = prefs[agent] || [];
            
            // If new partner is not in list, strictly unacceptable (IR violation)
            if (pList.indexOf(newPartner) === -1) return false;

            // If currently unmatched (and role satisfaction is equal), prefer being matched
            if (curr.partner === null) return true;

            // Compare Ranks (Lower index is better)
            const currRank = pList.indexOf(curr.partner);
            const newRank = pList.indexOf(newPartner);

            // If current partner wasn't in list (bad match), any valid partner is better
            if (currRank === -1) return true;

            return newRank < currRank;
        }

        // Iterate all possible pairs {i, j}
        for (let i = 1; i <= N; i++) {
            for (let j = 1; j <= N; j++) {
                if (i === j) continue;
                
                // Deduplicate checks ({1,2} same as {2,1})
                const pairKey = i < j ? `${i}-${j}` : `${j}-${i}`;
                if(seenPairs.has(pairKey)) continue;
                seenPairs.add(pairKey);

                // Check Deviation A: i=L, j=F
                if (isBetter(i, 'L', j) && isBetter(j, 'F', i)) {
                    blockingPairs.push({
                        p1: i, r1: 'L',
                        p2: j, r2: 'F',
                        reason: `Both prefer: Agent ${i} becomes Leader, Agent ${j} becomes Follower`
                    });
                }

                // Check Deviation B: i=F, j=L
                if (isBetter(i, 'F', j) && isBetter(j, 'L', i)) {
                    blockingPairs.push({
                        p1: i, r1: 'F',
                        p2: j, r2: 'L',
                        reason: `Both prefer: Agent ${i} becomes Follower, Agent ${j} becomes Leader`
                    });
                }
            }
        }

        // --- 3. DISPLAY RESULTS ---
        const statusBox = document.getElementById('statusBox');
        const details = document.getElementById('details');
        const resultArea = document.getElementById('result-area');

        resultArea.style.display = 'block';
        details.innerHTML = '';

        if (blockingPairs.length === 0) {
            statusBox.className = 'status-box stable';
            statusBox.innerText = 'STABLE MATCHING';
            details.innerText = 'No blocking pairs found. The configuration is robust.';
        } else {
            statusBox.className = 'status-box unstable';
            statusBox.innerText = `UNSTABLE (${blockingPairs.length} Blocking Pairs)`;
            
            blockingPairs.forEach(bp => {
                const div = document.createElement('div');
                div.className = 'blocking-pair';
                div.innerHTML = `<strong>Blocking Pair {${bp.p1}, ${bp.p2}}:</strong> ${bp.reason}`;
                details.appendChild(div);
            });
        }
    }
</script>

</body>
</html>
